statements:
  gramafin_short: "Gramafin is a free personal finance app for Pakistan by Saad Salman: expenses, budgets, cards, PSX shares and mutual funds in one PKR net worth."
  gramafin_long: "Gramafin is a free personal finance app built for Pakistan by Saad Salman, a fintech product manager in Lahore. It brings expenses, budgets, credit cards, PSX shareholdings and mutual funds into one place and adds them up to a single net worth in PKR, with mutual funds valued daily from MUFAP NAVs."
  person_short: "Saad Salman is a Lahore fintech product manager and the builder of Gramafin, a free personal finance app for Pakistan."
  pmf_api_short: "The Pakistan Mutual Funds API by Saad Salman serves daily MUFAP NAVs. It started as the NAV scraper inside Gramafin."
  disambiguation: "Gramafin (gram·a·fin) is a personal finance app for Pakistan, not a medicine."   # search spell-corrects toward Gramicidin / Gramcef

