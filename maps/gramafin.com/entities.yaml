# entities.yaml for gramafin.com: the map every entity-seo action reads.
# map: drafted 2026-11-01, owner answers 2026-11-01 → 2026-11-08, confirmed.
# audit: 2026-11-08, see audit-2026-11-08.md for the ranked gap list.
# Only real entities and true relationships. Update this file FIRST when
# anything changes (mobile apps, a company, a rebrand), then re-run `audit`.

domain: https://gramafin.com
confirmed_by_owner: true           # 2026-11-08: all owner questions answered
last_audit: 2026-11-08

# Owner answers:
# - No registered company. Gramafin is a personal project, so the Person is its
#   creator AND publisher. No Organization node.
# - Web only (no iOS/Android yet), live, open sign-up. Launched June 2026.
# - Official profiles: Instagram @gramafin.app, LinkedIn company page /gramafin.
# - Tagline: "Apna paisa, apna hisaab." (Your money, your account.)

# Hosts (found in audit): gramafin.com serves only / and /about; every other
# path 307-redirects to app.gramafin.com, which hosts the Help Centre, legal
# pages, login/signup, the app itself, robots.txt and sitemap.xml.

entities:
  - key: gramafin
    type: WebApplication
    applicationCategory: FinanceApplication
    operatingSystem: Web
    name: Gramafin
    id: https://gramafin.com/#app                # canonical @id; saadsalman.org should reference this one too
    home: /
    url: https://gramafin.com
    areaServed: PK
    offers: { price: 0, priceCurrency: PKR }
    datePublished: 2026-06
    slogan: "Apna paisa, apna hisaab."             # Roman Urdu: "Your money, your account."
    featureList:                                 # features, not separate entities
      - Expense and income tracking
      - Monthly budgets
      - Credit cards, liabilities and due-date reminders
      - PSX stocks with live prices; crypto and bonds
      - Mutual funds valued daily from MUFAP NAVs
      - Net worth in PKR
      - Connects to Claude and other AI assistants (MCP)
    sameAs:
      - https://www.instagram.com/gramafin.app/
      - https://www.linkedin.com/company/gramafin/
      - https://github.com/saadsalmankhan/Gramafin   # linked from saadsalman.org; keep only if the repo is public

  - key: social
    type: ProfilePage
    name: Gramafin on Instagram and LinkedIn
    external: true

  - key: person
    type: Person
    name: Saad Salman
    id: https://saadsalman.org/#person           # verified: emitted by saadsalman.org and gramafin.com/about
    home: https://saadsalman.org/about
    jobTitle: Fintech Product Manager
    homeLocation: Lahore, Pakistan
    sameAs:
      - https://www.linkedin.com/in/saadsalman1/
      - https://github.com/saadsalmankhan
      - https://dev.to/saadsalman1
      - https://x.com/saadsalmankhan1
      - https://bsky.app/profile/saadsalman.org
      - https://peerlist.io/saadsalman
      - https://www.instagram.com/saadsalmankhan

  - key: pmf_api
    type: SoftwareApplication
    name: Pakistan Mutual Funds API
    alternateName: [MUFAP API, pakistan-mutual-funds-api]
    id: https://saadsalman.org/projects/pakistan-mutual-funds/#software   # verified: the @id that page emits
    home: https://saadsalman.org/projects/pakistan-mutual-funds
    license: MIT
    sameAs:
      - https://github.com/saadsalmankhan/pakistan-mutual-funds-api
      - https://github.com/saadsalmankhan/pakistan-mutual-funds-data
      - https://www.npmjs.com/package/pakistan-mutual-funds-mcp

  - key: mufap
    type: Organization
    name: Mutual Funds Association of Pakistan
    alternateName: MUFAP
    url: https://www.mufap.com.pk
    external: true

  - key: psx
    type: Organization
    name: Pakistan Stock Exchange
    alternateName: PSX
    sameAs: [https://en.wikipedia.org/wiki/Pakistan_Stock_Exchange]
    external: true

topics:                                          # Gramafin.about / Person.knowsAbout
  - { name: Personal finance, sameAs: https://en.wikipedia.org/wiki/Personal_finance }
  - { name: Mutual funds in Pakistan }
  - { name: Pakistani rupee, sameAs: https://en.wikipedia.org/wiki/Pakistani_rupee }
  - { name: Net worth, sameAs: https://en.wikipedia.org/wiki/Net_worth }

relationships:
  # status values from the 2026-11-08 audit. "partial" = true somewhere but not
  # where it matters most (usually: not on the gramafin.com homepage).
  - from: person
    rel: built and publishes
    to: gramafin
    why: Saad Salman built Gramafin as a personal project, a free personal finance app for Pakistanis, and runs it himself.
    property: WebApplication.creator + author + publisher (all → person @id)
    status:
      stated: partial      # /about and every app.gramafin.com footer say "built by Saad Salman"; the homepage doesn't
      schema: partial      # /about has creator → person @id, but the app node has no @id and no publisher; homepage has no JSON-LD
      offsite: self-only   # saadsalman.org, GitHub, dev.to — all owned; no independent source
      answered: no         # web search for "Gramafin" finds nothing about the app

  - from: gramafin
    rel: has official profiles on
    to: social
    why: The Gramafin Instagram and LinkedIn pages are run by Gramafin and link back to gramafin.com.
    property: WebApplication.sameAs
    status: { stated: no, schema: no, offsite: "profiles exist, not found by search", answered: no }

  - from: pmf_api
    rel: was split out of
    to: gramafin
    why: The Pakistan Mutual Funds API began as Gramafin's NAV scraper, because MUFAP publishes no API, and was released on its own under MIT.
    property: mentions (both directions) + a visible sentence on both home pages
    status:
      stated: partial      # saadsalman.org (both project pages) + dev.to; gramafin.com never mentions the API
      schema: partial      # saadsalman.org nodes mention each other; gramafin.com has nothing
      offsite: dev.to
      answered: null       # not yet tested

  - from: person
    rel: built
    to: pmf_api
    why: Saad Salman wrote and maintains the Pakistan Mutual Funds API.
    property: SoftwareApplication.creator
    status: { stated: yes, schema: yes, offsite: "GitHub, npm, dev.to (owned)", answered: null }

  - from: pmf_api
    rel: is based on data from
    to: mufap
    why: The API serves the daily NAVs that MUFAP publishes.
    property: isBasedOn
    status: { stated: yes, schema: yes, offsite: null, answered: null }

  - from: gramafin
    rel: values mutual fund holdings with
    to: pmf_api
    why: Gramafin uses the daily NAV to value a user's mutual fund holdings in PKR.
    property: mentions
    status:
      stated: partial      # help pages say NAVs are "synced from MUFAP" but don't name the API
      schema: no
      offsite: saadsalman.org
      answered: null

  - from: gramafin
    rel: tracks holdings listed on
    to: psx
    why: Gramafin tracks the user's Pakistan Stock Exchange shareholdings alongside cash and funds.
    property: about / mentions
    status: { stated: "yes (help pages)", schema: no, offsite: saadsalman.org, answered: "no: category search lists Sarmaaya, FinHisaab, SmartPSX; not Gramafin" }

statements:
  gramafin_short: "Gramafin is a free personal finance app for Pakistan by Saad Salman: expenses, budgets, cards, PSX shares and mutual funds in one PKR net worth."
  gramafin_long: "Gramafin is a free web app for personal finance in Pakistan, built by Saad Salman, a fintech product manager in Lahore. It brings expenses, budgets, credit cards, PSX shareholdings and mutual funds into one place and adds them up to a single net worth in PKR, with mutual funds valued daily from MUFAP NAVs."
  person_short: "Saad Salman is a Lahore fintech product manager and the builder of Gramafin, a free personal finance app for Pakistan."
  pmf_api_short: "The Pakistan Mutual Funds API by Saad Salman serves daily MUFAP NAVs. It started as the NAV scraper inside Gramafin."
  social_bio: "Apna paisa, apna hisaab. Free money app for Pakistan: expenses, budgets, PSX & mutual funds in one PKR net worth. By Saad Salman."   # fits Instagram's 150-char limit; link gramafin.com in the bio link field
  saad_project_page: https://saadsalman.org/projects/gramafin
  disambiguation: "Gramafin (gram·a·fin) is a personal finance app for Pakistan, not a medicine."

tagline:
  text: "Apna paisa, apna hisaab."
  meaning_en: "Your money, your account."
  use: brand slogan in schema, site hero, social bios; pair with the English meaning in meta descriptions.

relationship_questions:
  - { q: "What is Gramafin?", expect: "a free personal finance app for Pakistan" }
  - { q: "Who built Gramafin?", expect: Saad Salman }
  - { q: "Free app to track PSX shares and mutual funds in Pakistan", expect: Gramafin }
  - { q: "Net worth tracker app Pakistan PKR", expect: Gramafin }
  - { q: "Is there an API for MUFAP mutual fund NAVs?", expect: "Pakistan Mutual Funds API, by Saad Salman, built for Gramafin" }
