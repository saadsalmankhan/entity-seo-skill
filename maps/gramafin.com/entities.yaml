# entities.yaml for gramafin.com, from `/entity-seo map`.
# Drafted 2026-11-01 from public, self-published sources, then updated with the
# owner's answers the same day. gramafin.com itself was not reachable from the
# session. Lines marked TODO still need the owner.
# Only real entities and true relationships.

domain: https://gramafin.com
confirmed_by_owner: false          # flip to true once the TODOs below are answered
last_audit: null

# Owner answers (2026-11-01):
# - No registered company. Gramafin is a personal project, so the Person is its
#   creator AND publisher. No Organization node.
# - Web only (no iOS/Android yet), live, open sign-up.
# - Own social accounts: Instagram and LinkedIn.
# - Tagline chosen 2026-11-08: "Apna paisa, apna hisaab." (Your money, your account.)

entities:
  - key: gramafin
    type: WebApplication
    applicationCategory: FinanceApplication
    operatingSystem: Web browser
    name: Gramafin
    id: https://gramafin.com/#app
    home: /
    url: https://gramafin.com
    areaServed: PK
    offers: { price: 0, priceCurrency: PKR }
    datePublished: 2026-06                       # owner, 2026-11-08: launched June 2026
    slogan: "Apna paisa, apna hisaab."             # Roman Urdu: "Your money, your account." Show the English meaning beside it.
    featureList:                                 # features, not separate entities
      - Expense tracking
      - Budgets
      - Credit card tracking
      - PSX holdings
      - Mutual fund holdings (daily NAV)
      - Net worth in PKR
    sameAs:
      - https://www.instagram.com/gramafin.app/  # TODO: confirm the exact handle (heard as "gramafin.app")
      - TODO                                     # LinkedIn page URL, e.g. https://www.linkedin.com/company/<slug>/

  - key: social                                 # the official profiles, listed in gramafin.sameAs above
    type: ProfilePage
    name: Gramafin on Instagram and LinkedIn
    external: true

  - key: person
    type: Person
    name: Saad Salman
    id: https://saadsalman.org/#person           # verified 2026-11-08: emitted by saadsalman.org
    home: https://saadsalman.org/about
    jobTitle: Fintech product manager
    homeLocation: Lahore, Pakistan
    sameAs: [https://saadsalman.org, https://dev.to/saadsalman1]   # TODO: add personal LinkedIn, GitHub

  - key: pmf_api
    type: SoftwareApplication
    name: Pakistan Mutual Funds API
    alternateName: pakistan-mutual-funds-api
    id: https://saadsalman.org/projects/pakistan-mutual-funds#app       # TODO: match the @id that page emits (checked in `audit`)
    home: https://saadsalman.org/projects/pakistan-mutual-funds         # verified 2026-11-08
    license: MIT
    sameAs: []                                   # TODO: GitHub repo, npm package, MCP listing

  - key: mufap
    type: Organization
    name: Mutual Funds Association of Pakistan
    alternateName: MUFAP
    url: https://www.mufap.com.pk
    external: true

  - key: psx
    type: Organization
    name: Pakistan Stock Exchange
    alternateName: PSX
    sameAs: [https://en.wikipedia.org/wiki/Pakistan_Stock_Exchange]
    external: true

topics:                                          # Gramafin.about / Person.knowsAbout
  - { name: Personal finance, sameAs: https://en.wikipedia.org/wiki/Personal_finance }
  - { name: Mutual funds in Pakistan }
  - { name: Pakistani rupee, sameAs: https://en.wikipedia.org/wiki/Pakistani_rupee }
  - { name: Net worth, sameAs: https://en.wikipedia.org/wiki/Net_worth }

relationships:
  - from: person
    rel: built and publishes
    to: gramafin
    why: Saad Salman built Gramafin as a personal project, a free personal finance app for Pakistanis, and runs it himself.
    property: WebApplication.creator + author + publisher (all → person @id)
    status: { stated: unknown, schema: null, offsite: "self-published only (saadsalman.org, dev.to)", answered: "no: 'Gramafin' search returns unrelated drug names" }

  - from: gramafin
    rel: has official profiles on
    to: social
    why: The Gramafin Instagram and LinkedIn pages are run by Gramafin and link back to gramafin.com.
    property: WebApplication.sameAs
    status: { stated: null, schema: null, offsite: "not indexed: search finds neither profile", answered: null }

  - from: pmf_api
    rel: was split out of
    to: gramafin
    why: The Pakistan Mutual Funds API began as Gramafin's NAV scraper, because MUFAP's own API doesn't work, and was released on its own under MIT.
    property: mentions (both directions) + a visible sentence on both home pages
    status: { stated: "saadsalman.org + dev.to", schema: "saadsalman.org only", offsite: dev.to, answered: null }

  - from: person
    rel: built
    to: pmf_api
    why: Saad Salman wrote and maintains the Pakistan Mutual Funds API.
    property: SoftwareApplication.creator
    status: { stated: yes, schema: yes, offsite: dev.to, answered: null }

  - from: pmf_api
    rel: is based on data from
    to: mufap
    why: The API serves the daily NAVs that MUFAP publishes.
    property: isBasedOn / mentions
    status: { stated: null, schema: null, offsite: null, answered: null }

  - from: gramafin
    rel: values mutual fund holdings with
    to: pmf_api
    why: Gramafin uses the daily NAV to value a user's mutual fund holdings in PKR.
    property: mentions
    status: { stated: null, schema: null, offsite: null, answered: null }

  - from: gramafin
    rel: tracks holdings listed on
    to: psx
    why: Gramafin tracks the user's Pakistan Stock Exchange shareholdings alongside cash and funds.
    property: about / mentions
    status: { stated: null, schema: null, offsite: null, answered: null }

statements:
  gramafin_short: "Gramafin is a free personal finance app for Pakistan by Saad Salman: expenses, budgets, cards, PSX shares and mutual funds in one PKR net worth."
  gramafin_long: "Gramafin is a free web app for personal finance in Pakistan, built by Saad Salman, a fintech product manager in Lahore. It brings expenses, budgets, credit cards, PSX shareholdings and mutual funds into one place and adds them up to a single net worth in PKR, with mutual funds valued daily from MUFAP NAVs."
  person_short: "Saad Salman is a Lahore fintech product manager and the builder of Gramafin, a free personal finance app for Pakistan."
  pmf_api_short: "The Pakistan Mutual Funds API by Saad Salman serves daily MUFAP NAVs. It started as the NAV scraper inside Gramafin."
  social_bio: "Apna paisa, apna hisaab. Free money app for Pakistan: expenses, budgets, PSX & mutual funds in one PKR net worth. By Saad Salman."   # fits Instagram's 150-char limit; link gramafin.com in the bio link field
  saad_project_page: https://saadsalman.org/projects/gramafin   # Gramafin's page on the creator's site (other end of 'built')
  disambiguation: "Gramafin (gram·a·fin) is a personal finance app for Pakistan, not a medicine."

tagline:
  text: "Apna paisa, apna hisaab."
  meaning_en: "Your money, your account."
  use: brand slogan in schema, site hero, social bios; pair with the English meaning in meta descriptions.

relationship_questions:
  - { q: "What is Gramafin?", expect: "a free personal finance app for Pakistan" }
  - { q: "Who built Gramafin?", expect: Saad Salman }
  - { q: "Free app to track PSX shares and mutual funds in Pakistan", expect: Gramafin }
  - { q: "Net worth tracker app Pakistan PKR", expect: Gramafin }
  - { q: "Is there an API for MUFAP mutual fund NAVs?", expect: "Pakistan Mutual Funds API, by Saad Salman, built for Gramafin" }

open_questions_for_owner:
  - Exact Instagram handle and LinkedIn page URL?
  - Whether gramafin.com says "by Saad Salman" will be checked in `audit` once gramafin.com is reachable.

